version: '3.8'

services:
  evolution-db:
    image: postgres:15-alpine
    container_name: evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=12345678
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:password@evolution-db:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=false
    depends_on:
      - evolution-db
    networks:
      - evolution-net

  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    container_name: evolution-manager
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./evolution-manager-nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
    networks:
      - evolution-net


networks:
  evolution-net:
    driver: bridge

volumes:
  evolution_db_data:
